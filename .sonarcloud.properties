# SonarCloud automatic analysis settings.
#
# experiments/runs and experiments/results hold experiment evidence (JSON/JSONL telemetry with fields
# such as prompt_tokens, completion_tokens and output_tokens_per_s), not code, and they are frozen once
# committed. Rule json:S6418 reads those numeric "token" fields as hard-coded secrets, so the data files
# are left out of the analysis; Python and other code under experiments/ is still analysed.
sonar.exclusions=experiments/runs/**/*.json,experiments/runs/**/*.jsonl,experiments/results/**/*.json
