[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flexsds"
version = "0.2.5"
description = "FlexSDS: Hardware-Adaptive EAGLE Speculative Decoding Serving Engine for LLMs"
authors = [
    {name = "Can Duc Khoi"},
    {name = "Bui Duc Dai"},
    {name = "Nguyen The Duong"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
flexsds = "flexsds.cli.main:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["flexsds*", "server*", "proposer*", "pipeline*", "experiments"]

[tool.setuptools.package-data]
flexsds = ["profiles/*.json", "assets/*"]
pipeline = ["prompts/*.md", "schemas/*.json", "examples/*", "sqlite/*.sql"]
experiments = ["scalar_vllm_source_manifest.json", "m4_eagle_source_manifest.json", "eagle_legacy_source_manifest.json"]
